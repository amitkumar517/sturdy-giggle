<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Simple Calculator</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .calculator {
            background-color: #333;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.4);
            width: 320px;
            box-sizing: border-box;
        }
        #display {
            width: 100%;
            height: 60px;
            background-color: #fff;
            font-size: 28px;
            text-align: right;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        button {
            padding: 18px 10px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #e0e0e0;
            transition: 0.1s;
        }
        button:hover { background-color: #d4d4d4; }
        button:active { transform: scale(0.95); }
        button.operator { background-color: #ff9500; color: white; }
        button.operator:hover { background-color: #e08500; }
        button.clear { background-color: #ff3b30; color: white; }
        button.clear:hover { background-color: #d32f2f; }
        button.backspace { background-color: #555; color: white; }
        button.backspace:hover { background-color: #444; }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" readonly placeholder="0">
    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button class="backspace" onclick="backspace()">⌫</button>
        <button onclick="appendValue('%')" class="operator">%</button>
        <button onclick="appendValue('/')" class="operator">/</button>
        
        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button onclick="appendValue('*')" class="operator">*</button>
        
        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button onclick="appendValue('-')" class="operator">-</button>
        
        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button onclick="appendValue('+')" class="operator">+</button>
        
        <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
        <button onclick="appendValue('.')">.</button>
        <button onclick="calculate()" class="operator">=</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');

    function appendValue(val) {
        // Agar display me pehle se Error hai to use saaf kar de
        if (display.value === 'Error') {
            display.value = '';
        }
        display.value += val;
    }

    function clearDisplay() {
        display.value = '';
    }

    function backspace() {
        // Ek number piche se kaatne ke liye
        display.value = display.value.slice(0, -1);
    }

    function calculate() {
        try {
            let expression = display.value;
            
            // Percentage (%) ko sahi se calculate karne ke liye use '/100' me badalna hoga
            if (expression.includes('%')) {
                expression = expression.replace(/%/g, '/100');
            }
            
            // Agar calculation khali hai to kuch mat karo
            if (expression.trim() === '') return;

            // Final answer nikalna
            let result = eval(expression);
            
            // Agar answer me bahut lambe decimals hain to unhe limit karna (jaise 0.1 + 0.2)
            if (result % 1 !== 0) {
                result = parseFloat(result.toFixed(8));
            }
            
            display.value = result;
        } catch (error) {
            display.value = 'Error';
        }
    }
</script>

</body>
</html>
